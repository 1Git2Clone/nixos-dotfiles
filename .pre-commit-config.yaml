# Also what CI runs, so the two cannot drift.
#
# The nix tools go through `nix develop .#ci` rather than bare $PATH, which
# for an editor or lazygit is not the dev shell.
#
#   nix develop -c pre-commit install       # once, per clone
#   nix develop -c pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # assets/sddm-hu-tao/ is vendored upstream and stays byte-identical;
      # ORIGIN.md is ours.
      - id: trailing-whitespace
        exclude: ^assets/sddm-hu-tao/(?!ORIGIN\.md)
      - id: end-of-file-fixer
        exclude: ^assets/sddm-hu-tao/(?!ORIGIN\.md)
      - id: check-merge-conflict
      - id: check-yaml
        # Nothing here acts on sops output. The *.example.yaml files are
        # plaintext, so they stay checked.
        exclude: ^secrets/(?!.*\.example\.yaml$).*\.yaml$
      # The default ceiling. Images are what used to need more, and art that
      # is not ours now lives in the private third-party-assets repo.
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        # dot-profile.d/*.sh carry a shebang for the editor but are sourced,
        # never executed, so chmod +x would be the wrong fix.
        exclude: ^dotfiles/

  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt-rfc-style
        description: Every .nix file in this repo is formatted with nixfmt-rfc-style.
        entry: nix develop .#ci -c nixfmt --check
        language: system
        files: \.nix$

      - id: statix
        name: statix
        description: Lint for nix antipatterns.
        entry: nix develop .#ci -c statix check
        language: system
        files: \.nix$
        pass_filenames: false

      - id: deadnix
        name: deadnix
        description: Unused let-bindings and function arguments.
        entry: nix develop .#ci -c deadnix --fail
        language: system
        files: \.nix$

      - id: shellcheck
        exclude: ^dotfiles/
        name: shellcheck
        description: install.sh and the VM harness are the only way this repo
          touches a disk; they get linted like production code.
        entry: nix develop .#ci -c shellcheck
        language: system
        files: \.sh$

      # The opencode skills' scripts are vendored and keep upstream's layout.
      - id: shfmt
        exclude: ^dotfiles/dot-config/opencode/skills/
        name: shfmt
        entry: nix develop .#ci -c shfmt --diff
        language: system
        files: (\.sh|/dot-(bashrc|zshrc|profile))$

      - id: markdownlint
        exclude: ^dotfiles/
        name: markdownlint
        entry: nix develop .#ci -c markdownlint
        language: system
        files: \.md$

      # The pages workflow runs on main only, so this is where a broken book
      # fails first: before the commit, and in CI on a pull request. It
      # catches what mdbook itself rejects -- a SUMMARY.md chapter with no
      # file (book.toml's create-missing = false), a bad book.toml, a missing
      # mermaid asset. A dead link *inside* a page still builds cleanly.
      # mdbook-mermaid install first, for the two gitignored JS files the
      # build references.
      - id: mdbook
        name: mdbook build
        entry: nix develop .#ci -c sh -c 'mdbook-mermaid install docs && mdbook build docs'
        language: system
        files: ^docs/
        pass_filenames: false

      # --staged, not a directory scan: a directory scan reads gitignored
      # files too. Full history is CI's job.
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: nix develop .#ci -c gitleaks git --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true

# dotfiles/ is unlinted by markdownlint and shellcheck: its own configs for
# them stayed behind in the repo it came from. Either bring those back scoped
# to dotfiles/, or fold the tree in and take the fixes. shfmt took its
# reformat on 2026-10-05.
