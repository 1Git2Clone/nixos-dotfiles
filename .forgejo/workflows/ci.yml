# ==============================================================================
# CI (Forgejo)
# ==============================================================================
# The same checks .github/workflows/ci.yml runs, for the instance this repo is
# actually hosted on. Same .pre-commit-config.yaml as the local commit hook, so
# a green CI means a clean `pre-commit run --all-files` and vice versa.
#
# Every `uses:` would need a full URL here -- Forgejo resolves a bare
# `actions/checkout@v4` against data.forgejo.org and not github.com -- which is
# moot, because this uses none. A JS action needs node inside the job's
# container, and needing node is the only reason a Nix repo would run its CI on
# an Ubuntu image and then spend a minute installing Nix into it. Cloning by
# hand costs four lines and lets the job run in an image that already is Nix.
#
# `runs-on: alpine` selects this instance's one runner by a label it registers
# (ubuntu-latest, node-22, alpine); `container:` then overrides whatever image
# that label maps to. Any of the three labels would do -- none of them decides
# what the job runs in.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no point linting a commit that is
# already two commits stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The image ships neither flag on, and every step below is a flake command.
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  lint:
    name: Format and lint
    runs-on: alpine
    container:
      image: nixos/nix:latest
    steps:
      # Full history, not a shallow clone: gitleaks below scans every commit,
      # and against a shallow clone it would scan almost nothing.
      - name: Clone at the tested commit
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix shell nixpkgs#git -c sh -eu -c '
            git config --global --add safe.directory "$PWD"
            git clone -q "https://oauth2:$TOKEN@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY" .
            git checkout -q --detach "$GITHUB_SHA"
          '

      - name: pre-commit
        run: nix develop .#ci -c pre-commit run --all-files --show-diff-on-failure

      # The pre-commit hook scans the STAGED diff, which is empty in CI, so the
      # history scan lives here instead.
      - name: gitleaks (full history)
        run: nix develop .#ci -c gitleaks git --redact --no-banner .

  evaluate:
    name: Evaluate the NixOS configurations
    runs-on: alpine
    container:
      image: nixos/nix:latest
    steps:
      # One commit is all an evaluation reads, so this fetches exactly that.
      - name: Fetch the tested commit
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix shell nixpkgs#git -c sh -eu -c '
            git config --global --add safe.directory "$PWD"
            git init -q .
            git remote add origin "https://oauth2:$TOKEN@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY"
            git fetch -q --depth 1 origin "$GITHUB_SHA"
            git checkout -q FETCH_HEAD
          '

      # Evaluation only, deliberately not a build. This catches the failure
      # that actually happens in this repo -- a renamed package, a typo'd
      # option, a module conflict -- without asking a CI runner to realise a
      # multi-gigabyte desktop closure.
      #
      # hutao-vm rather than hutao-laptop: the laptop config needs
      # hardware-configuration.nix and the encrypted hashes, neither of which
      # exists in a fresh clone. hutao-vm shares every module that can break
      # this way (modules/system.nix, modules/desktop, home-manager, stylix,
      # caelestia), so it is the honest thing to evaluate here.
      - name: Evaluate hutao-vm
        run: |
          nix eval --raw \
            '.#nixosConfigurations.hutao-vm.config.system.build.toplevel.drvPath'

      - name: Evaluate the installer ISO
        run: |
          nix eval --raw \
            '.#nixosConfigurations.installer.config.system.build.isoImage.drvPath'
