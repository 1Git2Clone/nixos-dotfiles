# ==============================================================================
# CI (Forgejo)
# ==============================================================================
# The same checks .github/workflows/ci.yml runs, for the instance this repo is
# actually hosted on. Same .pre-commit-config.yaml as the local commit hook, so
# a green CI means a clean `pre-commit run --all-files` and vice versa.
#
# `runs-on: nix-node` is the whole reason this file is as short as it is. That
# label is declared in the vps repo's modules/runner/ci-image.nix and resolves
# to an image carrying BOTH nix and node. Node is what makes `uses:` possible at
# all -- every JavaScript action, actions/checkout included, is executed by a
# node binary inside the job's container -- and nix is what the steps below run.
# Before that label existed this file had to pick one or the other, so it
# overrode `container:` with a Nix image and cloned by hand.
#
# THE OLD SHAPE IS WORTH REMEMBERING, because it went wrong in two ways at once:
#
#   container: image: nixos/nix:latest
#
# A floating tag. The runner pins nixos/nix:2.35.2 for its own `nix` label; this
# job overrode that with a `:latest` free to move underneath it between runs,
# which is the opposite of what a repo full of pinned flake inputs is for. The
# image behind `nix-node` is pinned by the vps repo's flake.lock.
#
#   git clone "https://oauth2:$TOKEN@..."
#
# A hand-written clone has to thread the job token through itself or it is
# anonymous -- and an anonymous clone still works against a public repo, so the
# mistake is invisible until a repo is private. This one IS private.
# actions/checkout defaults its `token` input to the token Forgejo injects, so
# that concern now lives in the action rather than in this file.
#
# The bare `actions/...` form resolves against DEFAULT_ACTIONS_URL, unset on
# this instance and therefore Forgejo's own default, which carries a synced
# mirror of the upstream action. No full URL needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no point linting a commit that is
# already two commits stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NIX_CONFIG is deliberately absent. The nix-node image bakes
# `experimental-features = nix-command flakes` into its own /etc/nix/nix.conf,
# asserted by tests/ci-image.nix in the vps repo, so declaring it here would be
# a second copy to keep in step with the image.

jobs:
  lint:
    name: Format and lint
    runs-on: nix-node
    steps:
      # fetch-depth: 0 is load-bearing, not caution. gitleaks below scans every
      # commit, and against the default shallow clone it would scan exactly one
      # and report clean -- a green run that checked almost nothing.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: pre-commit
        run: nix develop .#ci -c pre-commit run --all-files --show-diff-on-failure

      # The pre-commit hook scans the STAGED diff, which is empty in CI, so the
      # history scan lives here instead.
      - name: gitleaks (full history)
        run: nix develop .#ci -c gitleaks git --redact --no-banner .

  evaluate:
    name: Evaluate the NixOS configurations
    runs-on: nix-node
    steps:
      # No fetch-depth here: one commit is all an evaluation reads, and this
      # job has no history scanner to starve.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Evaluation only, deliberately not a build. This catches the failure
      # that actually happens in this repo -- a renamed package, a typo'd
      # option, a module conflict -- without asking a CI runner to realise a
      # multi-gigabyte desktop closure.
      #
      # The two real machines rather than hutao-vm: they import everything the
      # VM does plus disko and sops-nix, and a fresh clone carries both their
      # hardware-configuration.nix and the sops ciphertext -- which is decrypted
      # at activation, never at evaluation. hutao-vm stays a `nix run .#vm`
      # target, which is a thing to boot rather than a thing to evaluate.
      - name: Evaluate the desktop and the laptop
        run: |
          for host in hutao-desktop hutao-laptop; do
            nix eval --raw \
              ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
          done

      - name: Evaluate the installer ISO
        run: |
          nix eval --raw \
            '.#nixosConfigurations.installer.config.system.build.isoImage.drvPath'
