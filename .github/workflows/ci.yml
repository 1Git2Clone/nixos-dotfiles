# ==============================================================================
# CI
# ==============================================================================
# The same .pre-commit-config.yaml the local commit hook uses, so a green CI
# means a clean `pre-commit run --all-files` on the workstation and vice versa.
# There is one list of checks, not two.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no point linting a commit that is
# already two commits stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans commits; a shallow clone would scan almost nothing.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: pre-commit
        run: nix develop .#ci -c pre-commit run --all-files --show-diff-on-failure

      # The pre-commit hook scans the STAGED diff, which is empty in CI, so the
      # history scan lives here instead. fetch-depth 0 above is what makes it a
      # real scan rather than a scan of one commit.
      - name: gitleaks (full history)
        run: nix develop .#ci -c gitleaks git --redact --no-banner .

  evaluate:
    name: Evaluate the installer image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluation only, deliberately not a build — and only the installer.
      # The two real machines pull their cursor theme from the private
      # third-party-assets repo, so evaluating them here would mean handing a
      # runner a credential for that instance. They are rebuilt several times a
      # day on the machines themselves, and a rebuild that boots is a stronger
      # check than an eval that does not; a generation to roll back to is right
      # there if one does not. The installer imports nothing private.
      - name: Evaluate the installer ISO
        run: |
          nix eval --raw \
            '.#nixosConfigurations.installer.config.system.build.isoImage.drvPath'
