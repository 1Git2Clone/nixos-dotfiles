# The shape of secrets/secrets.yaml, decrypted. Reference only — nothing reads
# this file, and it is committed in the clear on purpose.
#
# NEVER run `sops -e` on this path. .sops.yaml's creation rule matches
# secrets/*.yaml, so sops will happily encrypt this file too, and a committed
# encrypted example is useless to everyone including you.
#
# To see the real thing:
#   SOPS_AGE_KEY_FILE=~/.sops-nix/key.txt nix develop -c sops secrets/secrets.yaml
#
# Author every value BEFORE running install.sh. The installer only reads
# secrets/secrets.yaml; it prompts for nothing and writes nothing back into the
# repo, and it refuses to start if any key below is missing or empty.

# === Main ===
# Password hashes, not passwords — `mkpasswd -m yescrypt`. A sha512sum digest
# is NOT a crypt(3) hash; hashedPasswordFile rejects it and, with
# users.mutableUsers = false, that is a host nobody can log into.
# Declared in modules/sops.nix with neededForUsers, so they render to
# /run/secrets-for-users early enough for user creation.
root_password: $y$j9T$SALTSALTSALTSALT$HASHHASHHASHHASHHASHHASHHASHHASHHASHHASH
user_password: $y$j9T$SALTSALTSALTSALT$HASHHASHHASHHASHHASHHASHHASHHASHHASHHASH

# === Bootstrap ===
# The LUKS passphrase itself, in the clear — cryptsetup needs the passphrase
# and not a hash of it, so unlike the two above this cannot be hashed.
#
# install.sh decrypts it, feeds it to `luksFormat` once, and shreds its copy.
# modules/sops.nix deliberately does NOT declare it: nothing on the installed
# system reads it, and declaring it would render the disk's own passphrase to
# /run/secrets on every boot of the machine it unlocks.
#
# This is not auto-unlock. The age key that decrypts this lives on your
# workstation and the installer, never on the unencrypted ESP, so nothing on
# the machine can open its own disk. You still type it at every boot.
#
# There is one keyslot and no recovery key — see docs/src/operations/hazards.md.
luks_passphrase: "CHANGEME"

# Reusable and pre-authorized, NOT ephemeral: the node has to survive reboots.
# Without it `tailscale up` blocks on a login URL and the first boot is not
# unattended. Mint one at https://login.tailscale.com/admin/settings/keys
# Consumed by modules/tailscale.nix as services.tailscale.authKeyFile.
tailscale_authkey: "tskey-auth-CHANGEME"

# Nesting is allowed here; modules/sops.nix reaches it with a `key` path and
# keeps its own attribute names flat:
#
#   backups_restic_password = { key = "backups/restic_password"; };
#
# backups:
#   restic_password: ...

# === LLM providers ===
# One key per provider, and the only place any of them is written down.
# modules/sops.nix renders these into a single env file
# (/run/secrets/rendered/llm.env) under the standard variable names, which
# dot-profile.d/environment.sh sources into every shell — so opencode,
# claude-code and the MCP servers are configured by the same two lines.
#
# Adding a provider is that pair of lines: the key here, and its env var in
# `llmKeys` in modules/sops.nix. Order does not matter, names must match.
# A key named in llmKeys but missing here fails activation, so add them
# together, and only once you actually hold the key.
llm:
  openrouter: sk-or-v1-...
  opencode: sk-...
  vercel: ...

# === Private flakes ===
# Read by the netrc template in modules/sops.nix, which nix.settings points at
# through netrc-file. One token per host, so either can be a flake input URL:
#
#   git+https://git.hu-tao.dev/hutao/<repo>    (source of truth)
#   git+https://github.com/1Git2Clone/<repo>   (mirror)
#
# A PAT with read access to the private repos, written with e.g.
#   sops set secrets/secrets.yaml '["nix"]["forgejo_token"]' '"<token>"'
# Both are named in `nixTokens` in modules/sops.nix; a name there with no key
# here fails activation, so add them together.
nix:
  forgejo_token: ...
  github_token: ...

syncthing_gui_password: ... # PLAINTEXT — syncthing-init bcrypts it
sunshine_password: ... # PLAINTEXT — sunshine --creds hashes it; web UI user is hutao
