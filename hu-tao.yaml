# hu-tao — base16 scheme derived from
# dotfiles: caelestia/schemes/hu-tao/default/dark.txt
#
# Mapped from that scheme's own semantic keys, so Stylix and caelestia stay
# in agreement. Retune there first, then mirror here.
system: "base16"
name: "hu-tao"
author: "hutao"
variant: "dark"
palette:
  base00: "130a0c"  # base            default background
  base01: "1e1215"  # surface0        lighter background, status bars
  base02: "2a1a1e"  # surface1        selection background
  base03: "6e4a52"  # overlay2        comments, invisibles
  base04: "c8c5d1"  # subtext1        dark foreground
  base05: "e5e1e7"  # text            default foreground
  base06: "f7e6e0"  # rosewater       light foreground
  base07: "ffffff"  # term15          light background
  base08: "ff6b69"  # red             variables, errors
  base09: "f66051"  # peach           integers, constants
  base0A: "ffe9c7"  # yellow          classes, search highlight
  base0B: "ff9b8a"  # green           strings
  base0C: "ab6670"  # mauve           support, escapes
  base0D: "EB6C6C"  # primary         functions, headings
  base0E: "EB826C"  # maroon          keywords
  base0F: "d94f6e"  # term5           deprecated
