bind C-M-l run "p=\$(tmux display -t \"\$TMUX_PANE\" -p '#{pane_current_path}'); \
              tmux split-window -h -c \"\$p\"; \
              tmux split-window -v -c \"\$p\"; \
              tmux split-window -h -c \"\$p\"; \
              tmux resize-pane -D 15; \
              tmux select-pane -R; \
              tmux resize-pane -L 40"


bind C-t run-shell "workmux sidebar"

# Persist sessions to disk: layouts, window names, pane working dirs.
# prefix + Ctrl-s = save   |   prefix + Ctrl-r = restore
set -g @resurrect-capture-pane-contents 'on'

# resurrect restores a pane by retyping a command line, so anything stateful
# has to resume itself: nvim off the persistence.nvim session for the pane's
# directory, claude off the exact conversation the pane held -- Claude's
# SessionStart hook tags the pane with it, the post-save hook records the tags
# by pane position. (`[[...]]` is a Lua string literal -- it keeps quotes out
# of the quoting.)
set -g @resurrect-processes '"~claude->tmux-resurrect-resume-claude.sh" "~nvim->nvim -c \"lua require([[persistence]]).load()\""'
set -g @resurrect-hook-post-save-all "tmux-resurrect-save-claude.sh"

# workmux opens its own sidebar in every restored window, so drop the empty
# shell resurrect restores in the old sidebar's place (one ghost pane per
# window).
set -g @resurrect-hook-post-restore-all "tmux-resurrect-drop-sidebars.sh"

# Auto-save every 15 min and auto-restore on tmux server start.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Plugins come from nixpkgs rather than TPM: TPM installs by cloning into
# ~/.tmux at runtime, which no rebuild would ever reproduce. The /usr paths are
# rewritten to /nix/store by the dotfiles derivation in home/hutao.nix.
# Keep these LAST: each plugin reads its @options at load time.
run-shell /usr/share/tmux-plugins/resurrect/resurrect.tmux
run-shell /usr/share/tmux-plugins/continuum/continuum.tmux
