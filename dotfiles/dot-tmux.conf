set -g default-terminal "tmux-256color"
# Advertise truecolor + overline to every outer terminal. Lives in the
# config (not just runtime state) so a hard refresh / fresh server keeps
# RGB -- without it tmux quietly falls back to 16/256 colours.
set -s terminal-features[0] "*:RGB:overline"
set -gu terminal-features
set -g terminal-features "*:RGB:overline"

# Statusline + pane borders (powerline pills). Colours come from
# tmux-apply-colors.sh, which sources colors.sh ($PRIMARY etc, live
# off the Caelestia scheme) and pushes already-resolved hex via
# set-option — tmux's own #(...) validates status-style/
# pane-border-style eagerly at set-time and rejects a shell-command
# placeholder outright ("invalid style"), so this runs outside tmux
# instead. Re-run it (or `tmux source-file ~/.tmux.conf`) any time to
# re-sync after a scheme switch.
set -g status-left-length 40
run-shell "tmux-apply-colors.sh"

set -g focus-events on
set -g mouse on

# Vim motions
setw -g mode-keys vi

# Vim-style copy mode selection/yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Vim-style pane navigation. On C-hjkl rather than the bare letters for the
# same reason as the window nav below: repeatable binds hold the prefix table
# open, and `ls` right after a pane switch would otherwise switch again.
unbind h
unbind j
unbind k
unbind l
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# Vim-style pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind M-h move-pane -h -t .left \; select-layout -E
bind M-j move-pane -v -t .bottom \; select-layout -E
bind M-k move-pane -v -t .top \; select-layout -E
bind M-l move-pane -h -t .right \; select-layout -E

# Default next-layout: one stray keypress scrambles every pane in the window.
unbind Space

# Window nav on C-n/C-p, repeatable -- see the pane motions above: on the bare
# letters, typing `nix` or `nvim` inside the repeat window jumps a window.
unbind n
unbind p
bind-key -r C-n next-window
bind-key -r C-p previous-window

# Closing or moving a window out closes the gap in the numbering.
set -g renumber-windows on

# Move window to index: default `move-window -t` refuses if the index
# is taken, so this shifts the windows in between instead of erroring.
unbind .
bind . command-prompt -T target -p move-window { run-shell "tmux-move-window-shift.sh %%" }

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind = join-pane -v -s '{right-of}' \; select-layout -E
bind + join-pane -h -s '{down-of}'  \; select-layout -E

# Popups delegate to standalone scripts (tmux-popup-*.sh) that read
# colours live from the Caelestia scheme via caelestia-color.sh on every
# launch. tmux's own #(...) substitution is documented as async and
# resolves empty on a first/one-shot use, so the border colour has to be
# computed with plain synchronous bash in those scripts, not inline here.
bind c run-shell -b "tmux-popup-newwin.sh"
bind g run-shell -b "tmux-popup-lazygit.sh '#{pane_current_path}'"
bind f run-shell -b "tmux-popup-switcher.sh '#{pane_current_path}'"
bind s run-shell -b "tmux-popup-sessions.sh"
bind Enter switch-client -l

# Pins, harpoon for panes: a pin is a session, window and pane index, so
# one session can hold several. Alt+1..9,0 jump to the slot, prefix + \
# pins the current pane (the popup waits for a slot digit), prefix +
# BSpace unpins one.
bind -n M-1 run-shell -b "tmux-pin-jump.sh 1"
bind -n M-2 run-shell -b "tmux-pin-jump.sh 2"
bind -n M-3 run-shell -b "tmux-pin-jump.sh 3"
bind -n M-4 run-shell -b "tmux-pin-jump.sh 4"
bind -n M-5 run-shell -b "tmux-pin-jump.sh 5"
bind -n M-6 run-shell -b "tmux-pin-jump.sh 6"
bind -n M-7 run-shell -b "tmux-pin-jump.sh 7"
bind -n M-8 run-shell -b "tmux-pin-jump.sh 8"
bind -n M-9 run-shell -b "tmux-pin-jump.sh 9"
bind -n M-0 run-shell -b "tmux-pin-jump.sh 0"
bind \\ run-shell -b "tmux-popup-pins.sh pin '#{pane_id}'"
bind BSpace run-shell -b "tmux-popup-pins.sh unpin '#{pane_id}'"

bind M run-shell -b "tmux-popup-move-pane.sh '#{pane_id}'"
bind M-m run-shell -b "tmux-popup-move-window.sh '#{window_id}'"

# workmux's agent dashboard, in a popup; C-t (below) is its sidebar.
bind a display-popup -E -w 80% -h 60% "workmux dashboard"

