# The rest of the tree stays scanned, the encrypted sops file included: if a
# plaintext value ever lands in it, gitleaks failing is the point.
[extend]
useDefault = true

[[allowlists]]
description = "age public keys are recipients, not sensitive values"
paths = ['''^\.sops\.yaml$''']

[[allowlists]]
description = "public half of the throwaway VM test key"
paths = ['''^vm/authorized_keys$''']

[[allowlists]]
description = "vendored agent skill docs: example tokens in prose, not config"
paths = ['''^dotfiles/dot-config/opencode/skills/.*''']

# Scoped to the fingerprint's own shape, so a real token here still fails.
[[allowlists]]
description = "GPG signing-key fingerprint identifies a public key"
paths = ['''^dotfiles/dot-gitconfig$''']
regexes = ['''[A-Fa-f0-9]{40}''']
