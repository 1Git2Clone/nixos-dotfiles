# The handbook. docs/src/ is the source; docs/book/ is the render, gitignored,
# built and published by .forgejo/workflows/pages.yml.
#
#   nix run .#docs                       # live reload while writing
#   nix develop -c mdbook build docs     # what CI does (after mdbook-mermaid install)
#
# Same shape as the vps repo's handbook, so both read and publish the same way.

[book]
title = "nixos-dotfiles"
description = "The workstation flake: two machines, one desktop, and why each piece is the way it is."
authors = ["hutao"]
language = "en"
src = "src"

[build]
# A SUMMARY.md entry with no file fails the build instead of shipping a 404.
# Links inside a page are not checked; a dead one still builds.
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
# Generated by `mdbook-mermaid install docs` and gitignored; `nix run .#docs`
# and the pages workflow both run it first.
additional-js = ["mermaid.min.js", "mermaid-init.js"]
additional-css = ["diagrams.css"]
git-repository-url = "https://git.hu-tao.dev/hutao/nixos-dotfiles"
edit-url-template = "https://git.hu-tao.dev/hutao/nixos-dotfiles/_edit/main/docs/{path}"
# Served under a path on pages.hu-tao.dev, never a domain root.
site-url = "/hutao/nixos-dotfiles/docs/"

[output.html.search]
enable = true
