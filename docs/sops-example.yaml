# Reference only — nothing reads this file. It is what
#   SOPS_AGE_KEY_FILE=~/.sops-nix/key.txt nix develop -c sops secrets/secrets.yaml
# shows you, decrypted. The real file is sops ciphertext and is committed.
#
# Author every value here BEFORE running install.sh. The installer only reads
# secrets/secrets.yaml; it no longer prompts for anything and no longer writes
# hashes back into the repo.

# === Main ===
# Password hashes, not passwords. `mkpasswd -m yescrypt` produces these; a
# sha512sum digest is NOT a crypt(3) hash and hashedPasswordFile rejects it.
root_password: $y$j9T$SALTSALTSALTSALT$HASHHASHHASHHASHHASHHASHHASHHASHHASHHASH
user_password: $y$j9T$SALTSALTSALTSALT$HASHHASHHASHHASHHASHHASHHASHHASHHASHHASH

# === Bootstrap ===
# The LUKS passphrase, in the clear — cryptsetup needs the passphrase itself,
# so unlike the two above this cannot be a hash. install.sh feeds it to
# `luksFormat` once and shreds its copy; nothing on the installed system reads
# it, and modules/sops.nix does not declare it.
#
# This is not the same trust boundary as auto-unlock: the age key that decrypts
# it lives on your workstation and the installer, never on the unencrypted ESP.
# You still type this at every boot.
luks_passphrase: "CHANGEME"

# Pre-authorized and reusable, NOT ephemeral — the node has to survive reboots.
# Without it `tailscale up` blocks on a login URL and the first boot is not
# unattended. Mint one at https://login.tailscale.com/admin/settings/keys
tailscale_authkey: "tskey-auth-CHANGEME"

# Nesting is allowed here; modules/sops.nix reaches it with a `key` path and
# keeps its own attribute names flat:
#
#   backups_restic_password = { key = "backups/restic_password"; };
#
# backups:
#   restic_password: ...
